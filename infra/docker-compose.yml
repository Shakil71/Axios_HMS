# Local development dependencies. App containers (web/api/nginx) are added with the
# multi-stage Dockerfiles in Phase 1.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hms_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hms
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_owner -d hms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Full stack (build from repo root):  docker compose --profile app up --build
  api:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://hms_owner:${POSTGRES_PASSWORD}@postgres:5432/hms?schema=public
      S3_ENDPOINT: http://minio:9000
    depends_on: { postgres: { condition: service_healthy } }
    expose: ["4000"]

  web:
    profiles: [app]
    build: { context: .., dockerfile: apps/web/Dockerfile }
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on: [api]
    expose: ["3000"]

  nginx:
    profiles: [app]
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [web, api]

volumes:
  pgdata:
  miniodata:
