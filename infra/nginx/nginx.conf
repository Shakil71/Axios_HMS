# TLS is terminated at Cloudflare / the load balancer; add `listen 443 ssl` + certs if terminating here.
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  server_tokens off;
  client_max_body_size 1m;                       # uploads go straight to object storage, never through nginx
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream web { server web:3000; }
  upstream api { server api:4000; }

  server {
    listen 80;
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
